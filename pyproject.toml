[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimstack"
version = "0.0.1"
description = "The unbloated AI stack: minimal, zero-dependency inference and agent primitives."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.0",
]
authors = [
    { name = "Sooriya" },
]
keywords = ["ai", "llm", "agents", "orchestration", "openai", "ollama"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Sooriya04/slimstack"
Repository = "https://github.com/Sooriya04/slimstack"
Issues = "https://github.com/Sooriya04/slimstack/issues"

[dependency-groups]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23.0"]

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "function"

