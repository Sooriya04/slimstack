[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "slimstack"
version = "0.0.1"
description = "The unbloated AI stack: minimal, zero-dependency inference and agent primitives."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Sooriya" },
    { name = "Barbara Vane", email = "barbaravane2703@gmail.com" },
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/Sooriya04/slimstack"
Repository = "https://github.com/Sooriya04/slimstack"
